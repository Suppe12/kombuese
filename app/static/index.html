<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kombüse</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><!--: with black-translucent iOS cuts the app 47 pt short at the bottom -->
<meta name="apple-mobile-web-app-title" content="Kombüse">
<meta name="theme-color" content="#1c1714">
<script>
// Appearance per device: light, dark or the system setting; set before the page is drawn, so it does not flash
(() => { let m = 'system'; try { m = localStorage.getItem('ft-theme') || 'system'; } catch (e) {}
  if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m;
  const dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content = dark ? '#1c1714' : '#f6f1ea'; })();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root {
  --bg: #f6f1ea; --card: #fffdf9; --ink: #2a211b; --muted: #8a7c70; --line: #e6ddd2;
  --chip: #f0e7dc; --like: #2f9e64; --nope: #d9534f; --plan: #e0a422; --accent: #ef6c45;
  --shadow: 0 10px 30px rgba(60, 40, 20, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #1c1714; --card: #2a231e; --ink: #f3ebe2; --muted: #a89a8c; --line: #3d342d;
    --chip: #3a312a; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
}
:root[data-theme=dark] {
  --bg: #1c1714; --card: #2a231e; --ink: #f3ebe2; --muted: #a89a8c; --line: #3d342d;
  --chip: #3a312a; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
}
:root { color-scheme: light dark; }
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
/* iOS: the page itself never scrolls, only the areas inside it. If the document scrolls along (chained scrolling, keyboard),
   Safari shifts the hit areas of the fixed layers (recipe, cooking mode, prep) and taps miss. */
html, body { overflow: hidden; }
body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); position: fixed; inset: 0; width: 100%; }
html { background: var(--card); }  /* whatever still shows below the layers looks like the tab bar */
.scroll, .recipe, .cook .cstep, .sheet .in, #shop, #likes, .rpick, .why, .rfilter { overscroll-behavior: contain; }
button, label, a, input, [onclick] { touch-action: manipulation; }
header { display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px; }
header h1 { font-size: 19px; margin: 0; flex: 1; letter-spacing: -.3px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
header h1 .logo { width: 28px; height: 28px; border-radius: 7px; }
header h1 span { color: var(--accent); }
.tabs { display: flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600;
  padding: 6px 10px; border-radius: 999px; }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--accent);
  color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
main { flex: 1; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: none; flex-direction: column; }
.view.on { display: flex; }

/* Stack */
#deck { flex: 1; position: relative; margin: 4px 16px 0; min-height: 0; }
.card { position: absolute; inset: 0; background: var(--card); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow);
  display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform;
  transition: transform .3s ease, opacity .3s ease; }
.card.drag { transition: none; }
.card .photo { flex: 1; min-height: 0; position: relative; background: var(--chip) center/cover no-repeat; }
.card .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0) 55%); }
.card .noimg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 72px; opacity: .5; }
.card .title { position: absolute; left: 18px; right: 18px; bottom: 14px; z-index: 1; color: #fff; }
.card .title h2 { margin: 0 0 6px; font-size: 25px; line-height: 1.15; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.card .title .src { font-size: 13px; opacity: .85; }
.card .info { padding: 14px 18px 16px; }
.card .reason { margin: 0 0 10px; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.chip.plan { background: var(--plan); color: #2a1d00; }
.kcal { position: absolute; top: 14px; right: 14px; z-index: 1; background: rgba(20,14,10,.72); color: #fff; border-radius: 999px;
  padding: 5px 11px; font-size: 15px; font-weight: 700; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.kcal small { font-weight: 500; opacity: .8; font-size: 11px; }
.why { position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 5; background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
  padding: 10px 12px; display: none; max-height: 62%; overflow-y: auto; }
.why.on { display: block; animation: up .2s ease; }
@keyframes up { from { transform: translateY(12px); opacity: 0; } }
.wed .head { display: flex; align-items: center; gap: 8px; }
.wed .head b { flex: 1; font-size: 13px; color: var(--muted); font-weight: 600; }
.wed .head .saved { font-size: 12px; color: var(--like); opacity: 0; transition: opacity .2s; }
.wed .head .saved.on { opacity: 1; }
.wed .x { border: 0; background: var(--chip); color: var(--muted); width: 28px; height: 28px; border-radius: 50%; font-size: 15px; flex: none; }
.wopts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.wopts button { border: 1px solid transparent; background: var(--chip); color: var(--ink); font: inherit; font-size: 14px; border-radius: 999px; padding: 6px 11px; }
.wopts button.on { background: var(--nope); color: #fff; }
.wopts.ing button.on { background: var(--accent); }
.wsub { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }
.wline { display: flex; gap: 6px; margin-top: 6px; }
.wline input { max-width: none; flex: 1; padding: 7px 10px; font-size: 16px; border-radius: 12px; }
.wline button { border: 0; background: var(--chip); color: var(--ink); font: inherit; font-size: 14px; border-radius: 12px; padding: 0 12px; }
.dis { display: flex; flex-wrap: wrap; gap: 6px; }
.dis span { background: var(--chip); border-radius: 999px; padding: 4px 4px 4px 11px; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.dis span small { color: var(--muted); font-size: 12px; }
.dis button { border: 0; background: none; color: var(--muted); font-size: 15px; width: 24px; height: 24px; border-radius: 50%; }
.taste { background: var(--card); border-radius: 16px; padding: 12px 14px; margin: 8px 0 4px; box-shadow: 0 2px 8px rgba(0,0,0,.06); font-size: 14px; }
.taste p { margin: 4px 0 8px; }
.taste .bars { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; }
.taste .bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.taste .bar i { display: block; height: 100%; background: var(--like); }
.taste .muted { color: var(--muted); font-size: 12px; }
.hintp { color: var(--muted); font-size: 13px; margin: -2px 2px 8px; }
.more { margin-top: 10px; font-size: 13px; color: var(--muted); }
.stamp { position: absolute; top: 26px; z-index: 2; padding: 4px 12px; border: 4px solid; border-radius: 10px; font-size: 30px;
  font-weight: 800; letter-spacing: 1px; opacity: 0; text-transform: uppercase; background: rgba(255,255,255,.12); }
.stamp.like { left: 22px; color: var(--like); transform: rotate(-14deg); }
.stamp.nope { right: 22px; color: var(--nope); transform: rotate(14deg); }
.stamp.plan { left: 50%; top: auto; bottom: 46%; color: var(--plan); transform: translateX(-50%) rotate(-4deg); font-size: 24px; }
.card.behind { transform: scale(.95) translateY(14px); }
.card.behind2 { transform: scale(.9) translateY(28px); opacity: .7; }

.controls { display: flex; justify-content: center; align-items: center; gap: 18px; padding: 16px 0 14px; }
.ctl { width: 62px; height: 62px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow);
  display: grid; place-items: center; font-size: 28px; color: var(--ink); }
.ctl:active { transform: scale(.92); }
.ctl.small { width: 46px; height: 46px; font-size: 20px; color: var(--muted); }
.ctl.nope { color: var(--nope); } .ctl.like { color: var(--like); } .ctl.plan { color: var(--plan); }
.ctl:disabled { opacity: .35; }
.hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: -6px; padding-bottom: 6px; }

/* Empty / refill */
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 24px; gap: 12px; }
.empty .big { font-size: 64px; }
.empty h3 { margin: 0; font-size: 20px; }
.empty p { margin: 0; color: var(--muted); max-width: 320px; }
textarea, input { width: 100%; max-width: 360px; font: inherit; font-size: 16px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; resize: none; }
.btn { border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; padding: 12px 22px; }
.btn.ghost { background: var(--chip); color: var(--ink); }
.btn:disabled { opacity: .5; }
.meals { display: flex; gap: 6px; margin: 2px 16px 8px; }
.meals button { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--muted); font: inherit; font-size: 14px;
  font-weight: 600; border-radius: 12px; padding: 7px 8px; }
.meals button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.meals button span { font-weight: 500; opacity: .7; font-size: 12px; margin-left: 3px; }
.pick { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
.pick button { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; border-radius: 999px; padding: 7px 12px; }
.pick button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.mtag { display: inline-block; font-size: 11px; background: var(--chip); border-radius: 6px; padding: 0 5px; margin-right: 4px; color: var(--muted); }
.refill-bar { margin: 0 16px; padding: 8px 12px; border-radius: 12px; background: var(--chip); font-size: 13px; color: var(--muted);
  display: none; align-items: center; gap: 8px; }
.refill-bar.on { display: flex; }
.spin { width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: s 1s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }

/* Bottom navigation */
.bnav { display: flex; border-top: 1px solid var(--line); background: var(--card); padding: 4px 4px 2px; }
/* The tab bar reaches down to the screen edge: the home indicator area of phones without a home button
   (iPhone X and later, any aspect ratio) is part of the bar instead of an empty band below it. */
.version { background: var(--card); color: var(--muted); color: color-mix(in srgb, var(--muted) 75%, transparent); font-size: 9.5px; text-align: center; letter-spacing: .2px;
  padding: 0 0 max(3px, calc(env(safe-area-inset-bottom) - 16px)); }
.changelog h4 { margin: 14px 0 4px; font-size: 15px; }
.changelog ul { margin: 0; padding-left: 18px; }
.changelog li { margin: 2px 0; font-size: 14px; }
.bnav button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; display: flex;
  flex-direction: column; align-items: center; gap: 1px; padding: 4px 0; position: relative; }
.bnav button i { font-style: normal; font-size: 21px; line-height: 1.15; filter: grayscale(1); opacity: .65; }
.bnav button.on { color: var(--accent); }
.bnav button.on i { filter: none; opacity: 1; }
.bnav .badge { position: absolute; top: 0; left: calc(50% + 6px); margin: 0; }
.scroll { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }

/* Week */
.weekbar { display: flex; align-items: center; gap: 8px; padding: 2px 16px 8px; }
.weekbar b { flex: 1; text-align: center; font-size: 15px; }
.weekbar button { border: 0; background: var(--chip); color: var(--ink); width: 38px; height: 32px; border-radius: 10px; font-size: 18px; }
.day { background: var(--card); border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.day.today { box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,.06); }
.day.past { opacity: .55; }
.day h4 { margin: 2px 0 4px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.day.today h4 { color: var(--accent); }
.meal { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.day h4 + .meal { border-top: 0; }
.meal .t { width: 24px; text-align: center; font-size: 17px; flex: none; }
.meal .n { flex: 1; min-width: 0; }
.meal .n b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meal .n small { color: var(--muted); font-size: 12px; }
.tag { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: var(--chip); color: var(--muted); white-space: nowrap; flex: none; }
.tag.cook { background: var(--accent); color: #fff; }
.tag.ice { background: #3d8fd1; color: #fff; }
.tag.warn { background: var(--plan); color: #2a1d00; }
.tag.bad { background: var(--nope); color: #fff; }
.tag.ok { background: var(--like); color: #fff; }
.yz { background: var(--card); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); font-size: 15px; }
.yz .bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 6px; }
.yz .bar i { display: block; height: 100%; background: var(--like); }
.yzrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.wp { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.wp h4 { margin: 0 0 4px; font-size: 16px; }
.wp p { margin: 4px 0 8px; font-size: 14px; }
.wp details { margin: 6px 0; font-size: 14px; }
.wp summary { color: var(--accent); font-weight: 600; cursor: pointer; }
.wp .btn { width: 100%; }
.wp .row2 .btn { width: auto; flex: 1; }
.wpday { margin: 8px 0 0; }
.wpday b { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; }
.wpday div { padding: 2px 0; }
.wpgr { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.wpgr:first-of-type { border-top: 0; }
.wpgr span { flex: 1; }
.wpgr small { color: var(--muted); display: block; }
.wpgr button { flex: none; font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--accent); font-weight: 600; }
.wpgr button:disabled { opacity: .4; }
.rpick { max-height: 40vh; overflow-y: auto; margin: 6px 0 12px; }
.rpick button { display: flex; width: 100%; text-align: left; gap: 8px; font: inherit; font-size: 15px; padding: 9px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); }
.rpick button span { flex: 1; }
.rpick button small { color: var(--muted); white-space: nowrap; }
.stars { display: flex; gap: 6px; justify-content: center; margin: 10px 0; }
.stars button { border: 0; background: var(--chip); color: var(--plan); font-size: 30px; width: 52px; height: 52px; border-radius: 14px; }
.stars button:active { transform: scale(.9); }
.rstars { display: flex; align-items: center; gap: 2px; margin-top: 8px; }
.rstars button { border: 0; background: none; font-size: 24px; color: var(--line); padding: 0 2px; }
.rstars button.on { color: var(--plan); }
.rstars span { margin-left: 6px; }

/* Pantry */
.vrow { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px 10px 10px 14px; margin-bottom: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.vrow .n { flex: 1; min-width: 0; }
.vrow .n b { display: block; font-size: 15px; font-weight: 600; }
.vrow .n small { color: var(--muted); font-size: 12px; }
.step { display: flex; align-items: center; gap: 2px; flex: none; }
.step button { border: 0; background: var(--chip); color: var(--ink); width: 36px; height: 36px; border-radius: 10px; font-size: 20px; font-weight: 600; }
.step span { min-width: 44px; text-align: center; font-weight: 700; font-size: 16px; line-height: 1.1; }
.step span small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.form { display: grid; gap: 8px; margin: 10px 0; }
.form label { font-size: 13px; color: var(--muted); display: grid; gap: 3px; }
.form input, .form select { max-width: none; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 9px 11px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Saved button in the header */
.hbtn { border: 0; background: var(--chip); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 6px 10px; }
.hbtn.on { background: var(--accent); color: #fff; }

/* Recipes */
.rsearch { padding: 0 16px 6px; display: flex; gap: 8px; align-items: center; }
.rsearch input { max-width: none; width: 100%; flex: 1; border-radius: 12px; padding: 9px 12px; }
.rsearch .hbtn { flex: none; padding: 9px 12px; }
.rfilter { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 8px; scrollbar-width: none; }
.rfilter button { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 13px; border-radius: 999px;
  padding: 5px 11px; white-space: nowrap; }
.rfilter button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rcard { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.rcard .img { aspect-ratio: 4/3; background: var(--chip) center/cover; }
.rcard .tx { padding: 7px 9px 9px; }
.rcard b { display: block; font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rcard small { color: var(--muted); font-size: 12px; }
.recipe { position: fixed; inset: 0; z-index: 9; background: var(--bg); overflow-y: auto; display: none;
  padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.recipe.on { display: block; }
.recipe .hero { height: 250px; background: var(--chip) center/cover; position: relative; }
.recipe .back { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; border: 0; width: 40px; height: 40px; border-radius: 50%;
  background: rgba(20,14,10,.6); color: #fff; font-size: 20px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.recipe .body { padding: 14px 16px; }
.recipe h2 { margin: 0 0 6px; font-size: 24px; line-height: 1.2; }
.recipe .acts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0 4px; }
.recipe .acts button { border: 0; background: var(--card); color: var(--ink); font: inherit; font-size: 12px; border-radius: 12px; padding: 8px 2px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.recipe .acts button i { font-style: normal; font-size: 20px; }
.recipe .portbar { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.recipe ul.ing { list-style: none; padding: 0; margin: 4px 0 0; }
.recipe ul.ing li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.recipe ul.ing li .q { min-width: 76px; color: var(--accent); font-weight: 600; text-align: right; flex: none; }
.recipe ul.ing li small { color: var(--muted); }
.recipe ul.ing li.sub { border: 0; padding-top: 12px; font-weight: 700; font-size: 13px; color: var(--muted); }
.recipe ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 4px 0 0; }
.recipe ol.steps li { counter-increment: s; position: relative; padding: 10px 0 10px 40px; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
.recipe ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 9px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.recipe ol.steps li.done { opacity: .4; }

.nutr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

/* Reheating */

/* Cooking mode */

  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

.cook .cstep h3 { margin: 0 0 8px; font-size: 20px; }
.cook .tchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.cook .tchips button { border: 0; background: var(--plan); color: #2a1d00; font: inherit; font-size: 16px; font-weight: 700; border-radius: 999px; padding: 8px 14px; }
.cook .timers { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 6px; }
.cook .timers span { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 700; }
.cook .timers span.alarm { background: var(--nope); color: #fff; animation: blink .6s step-end infinite; }
@keyframes blink { 50% { opacity: .35; } }
.cook .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 16px 12px; }
.cook .nav button { border: 0; border-radius: 16px; padding: 18px; font: inherit; font-size: 18px; font-weight: 700; background: var(--chip); color: var(--ink); }

.cook.prep .cstep { font-size: 20px; }
.cook .rcs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.rc { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--ink); line-height: 1.3; }
.rc::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.mpi { background: var(--card); border-radius: 14px; padding: 10px 12px; margin-top: 14px; font-size: 17px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }

.mpi div.z:first-of-type { border-top: 0; }
.mpi div.z b, .mpi label.z b { color: var(--accent); white-space: nowrap; min-width: 64px; }
.mpi i.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; align-self: center; margin-left: 3px; }
.mpi label.z { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 16px; color: var(--ink); }
.mpi label.z input { width: auto; align-self: center; }
.mpi label.z.ok span, .mpi label.z.ok b { text-decoration: line-through; color: var(--muted); }
.mpaside { margin-top: 12px; font-size: 16px; color: var(--muted); background: var(--chip); border-radius: 12px; padding: 8px 12px; }
.mpbar { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }

.mpbar p { margin: 2px 0 8px; font-size: 14px; }
.mpbar .btn { width: 100%; }
.mpl button { display: flex; width: 100%; gap: 10px; text-align: left; font: inherit; font-size: 15px; padding: 9px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); }
.mpl button.on { color: var(--accent); font-weight: 700; }
.mpl button.done { color: var(--muted); }
.cook .hint2 { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 4px; }

/* Shopping */
#shop { flex: 1; overflow-y: auto; padding: 6px 16px 12px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.item .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; flex: none;
  font-size: 15px; color: #fff; }
.item.done .box { background: var(--like); border-color: var(--like); }
.item .nm { flex: 1; min-width: 0; }
.item .nm b { display: block; font-size: 15px; font-weight: 600; }
.item .nm small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .qty { color: var(--muted); font-size: 14px; white-space: nowrap; }
.item.done .nm b, .item.done .qty { text-decoration: line-through; color: var(--muted); }
.shopbar { padding: 8px 16px 14px; }
.shopbar .btn { width: 100%; font-size: 16px; }
.shopbar .btn + .muted { text-align: center; margin-top: 6px; }
.muted { color: var(--muted); font-size: 13px; }

/* Saved list */
#likes { overflow-y: auto; padding: 6px 16px 24px; }
.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 16px 2px 8px; }
.row { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 16px; padding: 8px; margin-bottom: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.row .th { width: 64px; height: 64px; border-radius: 12px; background: var(--chip) center/cover; flex: none; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tx small { color: var(--muted); font-size: 12px; }
.row .tx small.ok { color: var(--like); } .row .tx small.err { color: var(--nope); }
.row .acts { display: flex; gap: 4px; }
.row .acts button, .row .acts a { border: 0; background: var(--chip); border-radius: 10px; width: 38px; height: 38px; font-size: 18px;
  display: grid; place-items: center; text-decoration: none; color: var(--ink); }
.row .acts .star.on { background: var(--plan); }
.foot { text-align: center; color: var(--muted); font-size: 13px; margin: 20px 0; }
.foot a { color: var(--accent); }

/* Sheets */
.sheet { position: fixed; inset: 0; z-index: 12; background: rgba(0,0,0,.45); display: none; align-items: flex-end; }
.sheet.on { display: flex; }
.sheet .in { background: var(--card); width: 100%; max-height: 85%; overflow-y: auto; border-radius: 22px 22px 0 0;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
.sheet h3, .setpage h3 { margin: 0 0 6px; font-size: 21px; }
.sheet p, .setpage p { margin: 6px 0; }
.sheet ul, .setpage ul { padding-left: 20px; margin: 8px 0 14px; }
.sheet li, .setpage li { margin: 3px 0; }
.sheet .row2, .setpage .row2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.sheet .row2 a, .setpage .row2 a { text-decoration: none; }
/* Settings page: groups in a list, a tapped item opens its page in the view (phone), two columns on the desktop.
   The pages are the former bottom sheets: #sheetIn moves into .setpage while the view is open */
.sethead { display: flex; align-items: center; gap: 8px; padding: 2px 12px 6px; }
.sethead b { flex: 1; font-size: 17px; }
.sethead button { border: 0; background: var(--chip); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; padding: 6px 12px; border-radius: 10px; }
.setwrap { flex: 1; min-height: 0; display: flex; }
.setlist, .setpage { flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); }
.setlist .scol:first-child > .sec:first-child { margin-top: 4px; }
.setlist .sgrp { background: var(--card); border-radius: 14px; padding: 2px 12px 4px; }
.setlist .mpl button:last-child { border-bottom: 0; }
.setlist .mpl button.on b { color: var(--accent); }
.setlist .meals { width: auto; margin: 6px 0 10px; }
.setlist label.muted { display: block; font-size: 13px; padding-top: 10px; }
.setsw i, .setsw em { font-style: normal; } .setsw em { display: none; }
.setpage .in { background: var(--card); border-radius: 16px; padding: 16px; }
.setpage .meals { width: auto; }
.setpage #sheetIn:empty::before { content: attr(data-empty); color: var(--muted); display: block; padding: 40px 0; text-align: center; }
#v-settings.page .setlist, #v-settings:not(.page) .setpage { display: none; }
.sheet:empty { display: none !important; }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s;
  pointer-events: none; white-space: nowrap; }
.toast.on { opacity: .92; }
.utoast { position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 19; display: none; align-items: center; gap: 10px;
  background: var(--ink); color: var(--bg); padding: 10px 12px 10px 14px; border-radius: 14px; font-size: 13px; box-shadow: var(--shadow); }
.utoast.on { display: flex; }
.scanbox { position: relative; width: 100%; height: 42vh; border-radius: 14px; overflow: hidden; background: #000; }
.scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanframe { position: absolute; left: 5%; top: 30%; width: 90%; height: 40%; border: 3px solid var(--accent); border-radius: 12px;
  box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; }
.utoast span { flex: 1; }
.utoast button { border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; padding: 7px 12px; flex: none; }
.vrow .qty { color: var(--ink); font-size: 14px; white-space: nowrap; }
@media (min-width: 600px) { .meals { width: 420px; margin-left: auto; margin-right: auto; } .why { width: 420px; margin: 0 auto; } #deck, .controls, .hint { width: 420px; margin-left: auto; margin-right: auto; } #deck { margin-top: 4px; } }
/* Start */
header h1 { cursor: pointer; }
.hhead { padding: 6px 2px 10px; }
.hhead h2 { margin: 0; font-size: 24px; letter-spacing: -.3px; line-height: 1.2; }
.hhead p { margin: 2px 0 0; }
.hjob { margin: 0 0 10px; }
.hgrid { display: grid; gap: 10px; }
.hcard { background: var(--card); border-radius: 16px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); min-width: 0; }
.hcard h4 { margin: 0 0 6px; font-size: 16px; }
.hcard h4 small { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 2px; }
.hcard p { margin: 4px 0 8px; font-size: 14px; }
.hcard .btn { width: 100%; }
.hclip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hmeal { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.hcard h4 + .hmeal { border-top: 0; }
.hmeal .th { width: 46px; height: 46px; border-radius: 10px; background: var(--chip) center/cover; flex: none; display: grid; place-items: center; font-size: 20px; }
.hmeal .n { flex: 1; min-width: 0; }
.hmeal .n b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hmeal .n small { color: var(--muted); font-size: 12px; }
.htiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.htile { background: var(--card); border-radius: 16px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.htile i { font-style: normal; font-size: 20px; }
.htile b { font-size: 24px; line-height: 1.1; }
.htile span { font-size: 12px; color: var(--muted); line-height: 1.25; }
.htile small { font-size: 12px; margin-top: 6px; line-height: 1.6; overflow-wrap: anywhere; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } }

/* Mouse and keyboard: hover and focus only for a fine pointer, phones and tablets stay as they are */
@media (hover: hover) and (pointer: fine) {
  button, [onclick], a, summary, select, input[type=checkbox] { cursor: pointer; }
  .rcard, .htile, .item, .vrow, .row, .hcard { transition: transform .15s ease, box-shadow .15s ease; }
  .rcard:hover, .htile:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(60, 40, 20, .18); }
  .item:hover, .vrow:hover, .row:hover { box-shadow: 0 4px 16px rgba(60, 40, 20, .16); }
  .meal:hover .n b, .hmeal:hover .n b, .mpl button:hover b, .rpick button:hover span, .wpgr button:hover { color: var(--accent); }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.ghost:hover:not(:disabled), .hbtn:hover, .weekbar button:hover, .step button:hover, .wline button:hover, .cook .top button:hover,
    .cook .nav button:hover:not(:disabled), .recipe .acts button:hover, .row .acts button:hover, .stars button:hover { filter: brightness(.94); }
  .rfilter button:hover:not(.on), .pick button:hover:not(.on), .meals button:hover:not(.on), .wopts button:hover:not(.on) { border-color: var(--muted); }
  .bnav button:hover:not(.on) { color: var(--ink); }
  .ctl:hover:not(:disabled) { transform: scale(1.07); }
  .recipe ol.steps li:hover::before { filter: brightness(1.1); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline-offset: 0; }
  #sheetIn:focus { outline: none; }
}

/* Desktop (from 1000 px): top bar instead of the bottom tabs, content in a centred container, columns, dialogs */
@media (min-width: 1000px) {
  :root { --bar: 64px; --wide: 1200px; --gut: max(24px, calc((100vw - var(--wide)) / 2)); }
  body { display: grid; grid-template-columns: var(--gut) auto auto 1fr auto auto var(--gut); grid-template-rows: var(--bar) minmax(0, 1fr) auto; padding: 0; }
  body::before { content: ""; grid-row: 1; grid-column: 1 / -1; background: var(--card); border-bottom: 1px solid var(--line); }
  header { display: contents; }
  header > * { grid-row: 1; align-self: center; }
  header h1 { grid-column: 2; font-size: 21px; margin-right: 32px; }
  header h1 .logo { width: 32px; height: 32px; }
  #t-likes { grid-column: 5; margin-right: 8px; }
  header > .hbtn:last-child { grid-column: 6; }
  .hbtn { font-size: 14px; padding: 8px 14px; }
  .bnav { grid-row: 1; grid-column: 3; align-self: center; border: 0; background: none; padding: 0; gap: 2px; }
  .bnav button { flex: none; flex-direction: row; gap: 7px; font-size: 14px; padding: 8px 13px; border-radius: 10px; }
  .bnav button i { font-size: 17px; }
  .bnav button.on { background: var(--chip); }
  .bnav .badge { position: static; margin-left: 0; }
  main { grid-row: 2; grid-column: 1 / -1; }
  .version { grid-row: 3; grid-column: 1 / -1; background: none; font-size: 11px; padding: 4px 0 8px; cursor: pointer; }

  .scroll, #shop, #likes { padding: 22px var(--gut) 36px; }
  .rsearch { padding: 22px var(--gut) 10px; }
  .rsearch input { max-width: 520px; }
  .rfilter { padding: 0 var(--gut) 4px; }
  #linkBar { margin: 0 var(--gut) 8px !important; }
  .weekbar { padding: 18px var(--gut) 4px; justify-content: center; }
  .weekbar b { flex: none; min-width: 300px; font-size: 18px; }
  #refillBar { width: 420px; margin: 0 auto 8px; }

  /* Start */
  .hhead { padding: 0 2px 18px; }
  .hhead h2 { font-size: 30px; }
  .hjob { margin-bottom: 16px; }
  .hgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
  .hcard { padding: 16px 18px; border-radius: 18px; }
  .hcard h4 { font-size: 18px; margin-bottom: 8px; }
  .hcard .btn { width: auto; }
  .htiles { gap: 18px; margin-top: 18px; }
  .htile { padding: 16px 18px; border-radius: 18px; }
  .htile b { font-size: 32px; }
  .htile span { font-size: 14px; }
  .htile small { font-size: 13px; }

  /* Discover */
  #v-deck { padding-top: 18px; }

  /* Recipes */
  .rgrid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
  .rcard b { font-size: 15px; }
  .rcard .tx { padding: 9px 11px 11px; }
  .recipe { top: var(--bar); }
  .recipe .hero { width: min(var(--wide), calc(100% - 48px)); margin: 22px auto 0; height: 380px; border-radius: 20px; }
  .recipe .back { top: 14px; left: 14px; }
  .recipe .body { width: min(var(--wide), calc(100% - 48px)); margin: 0 auto; padding: 22px 0 30px; }
  .recipe .body.edit { width: min(760px, calc(100% - 48px)); padding-top: 22px !important; }
  .recipe h2 { font-size: 32px; }
  .recipe .acts { grid-template-columns: repeat(5, 120px); }
  .rcols { display: grid; grid-template-columns: 380px minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: 48px; align-items: start; }
  .rc-ing { grid-column: 1; grid-row: 1; }
  .rc-steps { grid-column: 2; grid-row: 1 / span 2; }
  .rc-more { grid-column: 1; grid-row: 2; }
  .rc-steps .btn { width: auto !important; padding-left: 28px; padding-right: 28px; }
  .recipe ol.steps li { font-size: 16px; padding-top: 12px; padding-bottom: 12px; }
  .recipe ol.steps li::before { top: 11px; }

  /* Week: days as a grid, meal prep / proposal / Yazio in a column on the right */
  #week { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  #week > .foot { grid-column: 1 / -1; }
  .wside { grid-column: 2; grid-row: 1; position: sticky; top: 0; }
  .wdays { grid-column: 1; grid-row: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; align-items: start; }
  .wdays .day { margin: 0; padding: 12px 14px; }
  .wdays .meal .n b { white-space: normal; }
  .wdays .empty { grid-column: 1 / -1; }

  /* Pantry, shopping list, saved: the rows in columns, headings and forms across */
  #pantry, #shop, #likes { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); column-gap: 16px; align-content: start; }
  #pantry > :not(.vrow), #shop > :not(.item), #likes > :not(.row) { grid-column: 1 / -1; }
  #pantry > .meals { width: 360px; }
  #shop > .wline { max-width: 560px; }
  #shop > .taste, #likes > .taste { max-width: 760px; }
  .shopbar { padding: 12px var(--gut) 18px; display: flex; flex-direction: column; align-items: center; border-top: 1px solid var(--line); }
  .shopbar .btn { width: auto; min-width: 380px; }

  /* Sheets as centred dialogs */
  .sheet { align-items: center; justify-content: center; padding: 40px; }
  .sheet .in { width: min(600px, 100%); max-height: calc(100vh - 80px); border-radius: 20px; padding: 22px 26px 24px; box-shadow: var(--shadow); animation: pop .16s ease; }
  .sheet .meals { width: auto; }
  .sethead { padding: 14px var(--gut) 6px; } .sethead b { font-size: 20px; } .sethead .sback { display: none; }
  .setwrap { padding: 0 var(--gut); gap: 28px; }
  /* The list fits on one screen: two columns of groups, one line per item (the explanation as a tooltip),
     language and appearance as small switches in one row. Only the page on the right scrolls */
  #v-settings .setlist, #v-settings.page .setlist { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; align-content: start; align-items: start;
    flex: none; width: clamp(440px, 40vw, 520px); padding: 0 2px 24px; }
  .setlist .sec { font-size: 11px; letter-spacing: .5px; margin: 14px 4px 5px; }
  .setlist .scol > .sec:first-child { margin-top: 4px; }
  .setlist .sgrp { padding: 0 10px; border-radius: 12px; }
  .setlist .mpl button { font-size: 14px; padding: 7px 2px; gap: 8px; align-items: center; }
  .setlist .mpl button > span:last-child { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .setlist .mpl button b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .setlist .mpl button br, .setlist .mpl button:not(.kv) small { display: none; }

<script src="i18n.js"></script>
<script>
const $ = s => document.querySelector(s);
i18nStatic();
// Sign-in: POSTs carry the app header (CSRF protection), without a session back to the login page
const _fetch = window.fetch.bind(window);
window.fetch = (url, opt = {}) => {
  const own = !/^https?:/i.test(String(url)) || String(url).startsWith(location.origin);
  if (own && opt.method && opt.method.toUpperCase() !== 'GET') opt = { ...opt, headers: { ...(opt.headers || {}), 'X-Kombuese': '1' } };
  return _fetch(url, opt).then(r => { if (own && r.status === 401) location.href = 'login'; return r; });
};
// JSON of an API answer. The server writes its messages in German; srv() (i18n.js) shows the known ones in the device language
const json = x => x.json().then(j => { if (j && typeof j.error === 'string') j.error = srv(j.error); return j; });
const offline = () => ({ error: t('common.unreachable') });
const api = (p, body) => fetch('api/' + p, body === undefined ? {} : {
  method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
}).then(json);
let stack = [], done = [], status = {};
// Addresses of the installation (KOMBUESE_URLS), for HTTPS hints and the PDF view outside the app
let CONFIG = { urls: [], https_url: '', author: '' };
fetch('api/config').then(x => x.json()).then(c => { CONFIG = c; }).catch(() => {});
const httpsHint = () => CONFIG.https_url ? ` (${CONFIG.https_url.replace(/^https:\/\//, '')})` : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Security review: text as a JS string inside an onclick="…" attribute. esc() alone is not enough there, the browser
// turns &#39; back into ' before the script runs; JSON.stringify quotes and escapes, esc() keeps the attribute intact
const jsq = s => esc(JSON.stringify(String(s ?? '')));
// Security review: links from recipes, cards and feeds only as http(s), never javascript: or data:
const safeUrl = u => /^https?:\/\//i.test(String(u ?? '').trim()) ? esc(String(u).trim()) : '#';
// iOS: after the keyboard or chained scrolling the page sometimes stays shifted a bit, then taps miss. Reset it.
const unshift = () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); };
window.addEventListener('scroll', unshift, { passive: true });
document.addEventListener('focusout', () => setTimeout(unshift, 50));
// iOS keyboard: the bottom sheet always sits in the visible area above the keyboard instead of behind it
function fitSheet() {
  const v = window.visualViewport, st = $('#sheet').style; if (!v) return;
  const kb = v.height < window.innerHeight - 80;
  st.top = kb ? v.offsetTop + 'px' : ''; st.height = kb ? v.height + 'px' : ''; st.bottom = kb ? 'auto' : '';
  const a = document.activeElement;
  if (kb && a && a.closest && a.closest('#sheetIn')) a.scrollIntoView({ block: 'nearest' });
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitSheet); visualViewport.addEventListener('scroll', fitSheet); }
document.addEventListener('focusin', () => setTimeout(fitSheet, 300));
// A bottom sheet with new content starts at the top instead of the scroll position of the previous one
new MutationObserver(() => {
  if (SET.on && $('#sheet').classList.contains('on') && $('#sheetIn').parentNode !== $('#sheet')) $('#sheet').classList.remove('on');  // a settings page, not a sheet
  if ($('#sheet').classList.contains('on') && !$('#sheet')._on) $('#sheetIn').scrollTop = 0; $('#sheet')._on = $('#sheet').classList.contains('on'); })
  .observe(document.getElementById('sheet'), { attributes: true, attributeFilter: ['class'] });

function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1600); }
// Version at the bottom: "v1.0 by Suppe12", tapping shows the changes (CHANGELOG.md). New version → one hint
let VERSION = null;
async function loadVersion() {
  VERSION = await fetch('api/version?lang=' + LANG).then(x => x.json()).catch(() => null);
  if (!VERSION) return;
  $('#version').textContent = `v${VERSION.version} by ${VERSION.autor}` + (VERSION.update ? ` · ${t('version.updateShort', { v: VERSION.update.latest })}` : '');
  let prev = null; try { prev = localStorage.getItem('ft-version'); localStorage.setItem('ft-version', VERSION.version); } catch (e) {}
  if (prev && prev !== VERSION.version) setTimeout(() => toast(t('version.new', { v: VERSION.version })), 1200);
}
let ME = null;
// Appearance per device: light, dark or system; the head script applies it before the first paint
function themeMode() { try { return localStorage.getItem('ft-theme') || 'system'; } catch (e) { return 'system'; } }
function setTheme(m) {
  try { localStorage.setItem('ft-theme', m); } catch (e) {}
  if (m === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = m;
  const dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content = dark ? '#1c1714' : '#f6f1ea';
  document.querySelectorAll('#themePick button').forEach((b, i) => b.classList.toggle('on', ['light', 'dark', 'system'][i] === m));
}
// ----- Settings page: its own view with groups instead of the bottom sheet. Each page is a former sheet:
// while the view is open #sheetIn sits in #setPage, so every function that fills #sheetIn draws into the page.
// Phone: the list, a tapped item shows its page with "‹ Back" (history state, back gesture). Desktop: list left, page right -----
const SET = { on: false, page: false, pushed: 0, skip: 0, prev: 'home', fn: '' };
async function openSettings(fn) {
  if (!SET.on) {
    if ($('#sheet').classList.contains('on')) await closeSheet();
    const cur = document.querySelector('main .view.on');
    SET.prev = cur && cur.id !== 'v-settings' ? cur.id.slice(2) : 'home';
    SET.on = true; SET.page = false; SET.fn = ''; SET.skip = 0;
    const s = $('#sheetIn'); s.innerHTML = ''; s.dataset.empty = t('settings.pick'); $('#setPage').appendChild(s);
    show('settings');
    try { history.pushState({ settings: 1 }, ''); SET.pushed = 1; } catch (e) { SET.pushed = 0; }
  }
  await setList();
  if (fn) setOpen(fn);
}
async function settingsSheet() {  // the name stays: every "Back" of a page leads here, back to the list
  if (!SET.on) return openSettings();
  setListState(false); await setList();
}
function setOpen(fn) {  // an item of the list: its page
  SET.fn = fn;
  document.querySelectorAll('#setList .mpl button').forEach(b => b.classList.toggle('on', b.dataset.fn === fn));
  $('#setPage').scrollTop = 0;
  window[fn]();
}
function setListState(fromPop) {
  SET.page = false; SET.fn = '';
  $('#v-settings').classList.remove('page');
  $('#sheetIn').innerHTML = '';
  document.querySelectorAll('#setList .mpl button.on').forEach(b => b.classList.remove('on'));
  if (!fromPop && SET.pushed === 2) { SET.skip++; history.back(); }
  if (SET.pushed === 2) SET.pushed = 1;
}
function setBack() { if (SET.page) setListState(false); else show(SET.prev); }
function setLeave() {  // another view is shown: #sheetIn goes back into the bottom sheet
  if (!SET.on) return;
  SET.on = false; SET.page = false; SET.fn = '';
  $('#v-settings').classList.remove('page');
  $('#sheetIn').innerHTML = ''; $('#sheet').appendChild($('#sheetIn'));
  if (SET.pushed) { SET.skip++; history.go(-SET.pushed); SET.pushed = 0; }
}
// Something was drawn into the page (an item, a deep link, a page opening the next one) → the page is shown
new MutationObserver(() => {
  if (!SET.on || $('#sheetIn').parentNode !== $('#setPage') || !$('#sheetIn').childNodes.length || SET.page) return;
  SET.page = true; $('#v-settings').classList.add('page'); $('#setPage').scrollTop = 0;
  if (SET.pushed === 1) try { history.pushState({ settings: 2 }, ''); SET.pushed = 2; } catch (e) {}
}).observe($('#sheetIn'), { childList: true });
window.addEventListener('popstate', () => {
  if (SET.skip) { SET.skip--; return; }
  if (!SET.on || $('#recipe').classList.contains('on')) return;
  if (SET.page && SET.pushed === 2) { SET.pushed = 1; setListState(true); }
  else { SET.pushed = 0; show(SET.prev); }
});
function setLangHere(l) { try { sessionStorage.setItem('ft-settings', '1'); } catch (e) {} setLang(l); }  // back in the settings after the reload
async function setList() {
  ME = ME || await fetch('api/me').then(x => x.json()).catch(() => null);
  const admin = ME && ME.role === 'admin', V = VERSION;
  const row = (icon, title, info) => `<span>${icon}</span><span><b>${title}</b><br><small class="muted">${info}</small></span>`;
  // On the desktop an item is one line and its explanation a tooltip; kv: the info is a value (name, version) and stays visible there
  const tip = info => { const p = String(info || '').replace(/<[^>]*>/g, '').replace(/&(amp|lt|gt|quot|#39);/g, (m, k) => ({ amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" })[k]);
    return p ? ` title="${esc(p)}"` : ''; };
  const item = (icon, fn, title, info, kv) => `<button data-fn="${fn}" class="${SET.fn === fn ? 'on' : ''}${kv ? ' kv' : ''}"${tip(info)} onclick="setOpen('${fn}')">${row(icon, title, info)}</button>`;
  const act = (icon, js, title, info) => `<button${tip(info)} onclick="${js}">${row(icon, title, info)}</button>`;
  const link = (icon, url, title, info) => /^https?:\/\//i.test(String(url || '')) ? act(icon, `window.open(${jsq(url)}, '_blank', 'noopener')`, title, info) : '';
  const grp = (title, body) => body.trim() ? `<div class="sec">${title}</div><div class="sgrp">${body}</div>` : '';
  // Language and appearance: <i> is the label on the phone, <em> the short one in the single desktop row
  const theme = t('settings.theme'), dev = `<div class="setsw"><div class="setsw1"><label class="muted">Sprache / Language</label>
      <div class="meals" title="Sprache / Language"><button class="${LANG === 'de' ? 'on' : ''}" title="Deutsch" onclick="setLangHere('de')"><i>🇩🇪 Deutsch</i><em>DE</em></button>
        <button class="${LANG === 'en' ? 'on' : ''}" title="English" onclick="setLangHere('en')"><i>🇬🇧 English</i><em>EN</em></button></div></div>
      <div class="setsw1"><label class="muted">${theme}</label>
      <div class="meals" id="themePick" title="${theme}">${[['light', '☀️', t('settings.themeLight'), '☀️'], ['dark', '🌙', t('settings.themeDark'), '🌙'], ['system', '📱', t('settings.themeSystem'), '🖥️']]
        .map(([k, i, l, d]) => `<button class="${themeMode() === k ? 'on' : ''}" title="${theme}: ${l}" onclick="setTheme('${k}')"><i>${i} ${l}</i><em>${d}</em></button>`).join('')}</div></div></div>`;
  // Two columns on the desktop, one after the other on the phone: device, account, household | services, admins, about
  $('#setList').innerHTML = '<div class="scol">' + grp(t('settings.gDevice'), `${dev}
      ${ME ? `<div class="mpl">${item('🔔', 'notifSheet', t('settings.notif'), t('settings.notifInfo'))}</div>` : ''}`)
    + grp(t('settings.account'), ME ? `<div class="mpl">${item('👤', 'accountSheet', t('settings.account'), esc(ME.display_name || ME.username) + (admin ? ' · Admin' : ''), 1)}
      ${act('🚪', 'signOut()', t('account.signOut'), t('settings.signOutInfo'))}</div>` : '')
    + (admin ? grp(t('settings.household'), `<div class="mpl">${item('🏠', 'householdSheet', t('settings.household'), t('settings.householdInfo'))}
        ${item('👥', 'usersSheet', t('settings.users'), t('settings.usersInfo'))}${item('🔗', 'sharesSheet', t('settings.shares'), t('settings.sharesInfo'))}</div>`) : '')
    + '</div><div class="scol">' + (admin ? grp(t('settings.gServices'), `<div class="mpl">${item('🔌', 'connSheet', t('settings.conn'), t('settings.connInfo'))}${item('🤖', 'aiSheet', t('settings.ai'), t('settings.aiInfo'))}${item('🎬', 'videoSheet', t('settings.video'), t('settings.videoInfo'))}</div>`)
      + grp(t('settings.gAdmin'), `<div class="mpl">${item('🔑', 'tokenSheet', t('settings.tokens'), t('settings.tokensInfo'))}
        ${act('📖', "window.open('api/docs', '_blank', 'noopener')", t('tokens.docs'), t('settings.docsInfo'))}
        ${item('💾', 'backupSheet', t('settings.backup'), t('settings.backupInfo'))}</div>`) : '')
    + grp(t('settings.gAbout'), `<div class="mpl">${item('ℹ️', 'versionSheet', t('settings.whatsNew'), V ? 'v' + esc(V.version) + ' by ' + esc(V.autor) : '', 1)}
      ${V ? link('📜', V.source_url, t('version.source'), t('settings.sourceInfo')) : ''}</div>`) + '</div>';
}
// ----- Connections: Bring, Yazio, Telegram, ntfy; passwords never come back into the app -----
const CONN = {
  bring: { icon: '🛒', name: 'Bring!', info: 'conn.bringInfo',
    fields: [['email', 'conn.email', 'email'], ['password', 'conn.password', 'password'], ['list', 'conn.bringList', 'text']] },
  yazio: { icon: '🥗', name: 'Yazio', info: 'conn.yazioInfo',
    fields: [['email', 'conn.email', 'email'], ['password', 'conn.password', 'password']] },
  telegram: { icon: '✈️', name: 'Telegram', info: 'conn.telegramInfo',
    fields: [['bot_token', 'conn.botToken', 'password'], ['chat_id', 'conn.chatId', 'text']] },
  ntfy: { icon: '🔔', name: 'ntfy', info: 'conn.ntfyInfo',
    fields: [['server', 'conn.ntfyServer', 'url'], ['topic', 'conn.topic', 'text'], ['token', 'conn.accessToken', 'password']] },
};
let CONNDATA = null;
async function connSheet() {
  CONNDATA = await fetch('api/integrations').then(json).catch(() => null);
  if (!CONNDATA || CONNDATA.error) return toast((CONNDATA && CONNDATA.error) || t('common.unreachable'));
  $('#sheetIn').innerHTML = `<h3>${t('conn.heading')}</h3><div class="mpl">${Object.entries(CONN).map(([k, v]) => {
    const d = CONNDATA[k] || {};
    return `<button onclick="connForm('${k}')"><span>${v.icon}</span><span><b>${v.name}</b><br><small class="muted">${d.configured ? (d.source === 'file' ? t('conn.connectedFile') : t('conn.connected')) : t('conn.notConnected')}</small></span></button>`;
  }).join('')}
    <button onclick="notifSheet()"><span>📲</span><span><b>Web Push</b><br><small class="muted">${t('push.devices', { n: (CONNDATA.webpush || {}).devices || 0 })}</small></span></button></div>
    <p class="muted" style="font-size:13px">${t('conn.encrypted')}</p>
    <div class="row2"><button class="btn ghost" onclick="settingsSheet()">${t('common.back')}</button></div>`;
}
function connForm(k) {

function privateHost(h) {
  h = h.replace(/^\[|\]$/g, '').toLowerCase();
  if (h === 'localhost' || !h.includes('.') && !h.includes(':') || /\.(local|lan|home|arpa|internal|intranet|localdomain|localhost|lab|box|router|ip|speedport\.ip|fritz\.box)$/.test(h)) return true;
  const v4 = h.match(/^(\d+)\.(\d+)\.\d+\.\d+$/);
  if (v4) { const [a, b] = [+v4[1], +v4[2]];
    return a === 10 || a === 127 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168) || (a === 169 && b === 254) || (a === 100 && b >= 64 && b <= 127); }
  return h === '::1' || /^f[cd]/.test(h) || h.startsWith('fe80');
}

function attachDrag(el, c) {
  let sx = 0, sy = 0, dx = 0, dy = 0, down = false, moved = false;
  const stamps = { like: el.querySelector('.stamp.like'), nope: el.querySelector('.stamp.nope'), plan: el.querySelector('.stamp.plan') };
  el.addEventListener('pointerdown', e => { down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0; el.classList.add('drag'); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`;
    const up = -dy > 60 && Math.abs(dy) > Math.abs(dx);
    stamps.like.style.opacity = up ? 0 : Math.max(0, Math.min(1, dx / 100));
    stamps.nope.style.opacity = up ? 0 : Math.max(0, Math.min(1, -dx / 100));
    stamps.plan.style.opacity = up ? Math.min(1, (-dy - 60) / 80) : 0;
  });
  const end = () => {
    if (!down) return; down = false; el.classList.remove('drag');
    if (!moved) { el.style.transform = ''; return openDetails(c); }
    const w = el.offsetWidth;
    if (-dy > 120 && Math.abs(dy) > Math.abs(dx)) return fly(el, c, 'plan');
    if (dx > w * 0.28) return fly(el, c, 'like');
    if (dx < -w * 0.28) return fly(el, c, 'nope');
    el.style.transform = ''; Object.values(stamps).forEach(s => s.style.opacity = 0);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

const REASONS = ['zutat', 'viele', 'aufwand', 'lang', 'schwer', 'scharf', 'suess', 'exotisch', 'fleisch', 'mahlzeit', 'optik', 'kenn', 'grad'];
const SKIP_RE = /^(salz|pfeffer|salz und pfeffer|wasser|eiswasser|öl|speiseöl|pflanzenöl|rapsöl|olivenöl|sonnenblumenöl|natives olivenöl|zucker|salt|pepper|water|oil)\b/i;
const UNIT_RE = /^(g|kg|ml|l|cl|el|tl|msp|stück|stk|zehen?|knollen?|bund|dosen?|pck|päckchen|packung(en)?|prisen?|becher|gläser|glas|zweige?|scheiben?|blätter|blatt|handvoll|schuss|spritzer|cups?|tbsp|tsp|teaspoons?|tablespoons?|pounds?|lbs?|oz|große?n?|kleine?n?|mittelgroße?n?|large|medium|small|(frische|gehackte|gemahlene|getrocknete|tiefgekühlte|geräucherte|entsteinte)[nrs]?)\b\.?\s*/i;
function mainIngredients(c) {
  if (c.zutaten && c.zutaten.length) return c.zutaten;
  const out = [], seen = new Set();
  for (let s of c.ingredients || []) {
    s = s.replace(/\(.*?\)/g, ' ').split(/,| oder | or | zum | für /i)[0].trim();
    for (let i = 0; i < 4; i++) s = s.replace(/^[\d\s.,/½¼¾⅓⅔⅛–-]+/, '').replace(UNIT_RE, '').trim();
    if (!s || s.length > 28 || SKIP_RE.test(s)) continue;
    s = s[0].toUpperCase() + s.slice(1);
    if (seen.has(s.toLowerCase())) continue;
    seen.add(s.toLowerCase()); out.push(s);
    if (out.length >= 12) break;
  }
  return out;
}
let W = null, wT;
const hasIng = x => W.ings.some(y => y.toLowerCase() === x.toLowerCase());

    <div class="head"><b>${W.sheet ? esc(c.title) : t('why.title')}</b><span class="saved" id="wSaved">${t('why.saved')}</span>
      ${W.sheet ? '' : `<button class="x" onclick="hideWhy()" title="${t('common.close')}">✕</button>`}</div>
    <div class="wopts">${REASONS.map(k => `<button class="${W.why.has(k) ? 'on' : ''}" onclick="togWhy('${k}')">${t('why.r.' + k)}</button>`).join('')}</div>
    ${W.why.has('zutat') ? `<div class="wsub">${t('why.whichIng')}</div>
      <div class="wopts ing">${all.map(x => `<button class="${hasIng(x) ? 'on' : ''}" data-z="${esc(x)}" onclick="togIng(this.dataset.z)">${esc(x)}</button>`).join('')}</div>
      <div class="wline"><input id="wIng" placeholder="${t('why.otherIng')}" enterkeyhint="done" onkeydown="if(event.key==='Enter')addIng()"><button onclick="addIng()">＋</button></div>` : ''}

async function refreshStatus() {
  const prevMp = status.mealprep?.state, prev = status.refill?.state, prevWp = status.wochenplan?.state, prevLi = status.linkimport?.state;
  const prevKi = status.kochideen?.state, prevFi = status.fotoimport?.state, prevRh = status.aufwaermen?.state;
  status = await api('status');
  const rh = status.aufwaermen || {};  // reheating tips from the AI
  if (prevRh && rh.state !== prevRh && !['requested', 'running'].includes(rh.state)) {
    if (rh.state === 'done') toast(t('rh.aiDone'));
    if (rh.state === 'failed') toast(t('rh.aiFailed', { note: srv(rh.note || '') }));
    RECIPES = null; if ($('#v-recipes').classList.contains('on')) loadRecipes();
  }
  const ki = status.kochideen || {}, fi = status.fotoimport || {};  // pantry ideas and recipe from a photo
  if (prevKi && ki.state !== prevKi) {
    if (ki.state === 'done') toast(t('ideas.aiReady'));
    if (PTAB === 'ideas' && $('#v-pantry').classList.contains('on')) loadIdeas(); else KI = null;
  }
  if (prevFi && fi.state !== prevFi) {
    if (fi.state === 'done') { toast(t('photo.done', { name: fi.name || t('status.recipe') })); RECIPES = null; if ($('#v-recipes').classList.contains('on')) loadRecipes(); }
    if (fi.state === 'failed') photoFailSheet(fi);
  }
  const wp = status.wochenplan?.state, li = status.linkimport || {};
  const mp = status.mealprep?.state;
  if (prevMp && mp !== prevMp) { if ($('#v-week').classList.contains('on')) loadMp(); if (mp === 'done') toast(t('status.mpReady')); }
  if (prevWp && wp !== prevWp) { if ($('#v-week').classList.contains('on')) loadWp(); if (wp === 'done') toast(t('status.wpReady')); }
  if (prevLi && li.state !== prevLi) {
    if (li.state === 'done') { toast(t('status.linkDone', { name: li.name || t('status.recipe') })); RECIPES = null; if ($('#v-recipes').classList.contains('on')) loadRecipes(); }
    if (li.state === 'failed') toast(t('status.linkFailed', { note: li.note || '' }));
  }
  renderLinkBar();
  for (const m of ['haupt', 'fruehstueck']) { const c = (status.stack || {})[m] || 0; $('#n-' + m).textContent = c ? c : ''; }
  const n = (status.counts.like || 0) + (status.counts.mealie || 0) + (status.counts.fehler || 0);
  $('#nlikes').innerHTML = n ? `<span class="badge">${n}</span>` : '';
  const r = status.refill || {}, busy = r.state === 'requested' || r.state === 'running';
  $('#refillBar').classList.toggle('on', busy && stack.length > 0);
  $('#refillTxt').textContent = r.state === 'running' ? t('refill.running') : t('refill.requested');
  if (prev && prev !== r.state && !busy) { if (r.state === 'failed') toast(t('refill.failed')); await loadMoreSoon(); if (!stack.length) render(); }
  if (!stack.length) render();
}

async function photoShrink(file) {  // → JPEG data URL, longest side at most 2048 px (fits every provider's image limit)
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
    const f = Math.min(1, 2048 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * f)); c.height = Math.max(1, Math.round(img.naturalHeight * f));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}
async function photoPick(files) {
  const list = [...files];
  if (PHOTOS.length + list.length > 6) toast(t('photo.tooMany'));
  for (const f of list.slice(0, Math.max(0, 6 - PHOTOS.length))) {
    try { PHOTOS.push(await photoShrink(f)); } catch (e) { toast(t('photo.badType')); }
  }
  photoPreview();
}

let RECIPES = null, RFILTER = 'all', REC = null, SERVINGS = 2;
// Filters: all, favourites (4+ stars) and recipe categories or tags (German keys of the API, shown with rcat())
const RFILTERS = ['all', 'Frühstück', 'Hauptgericht', 'Mealprep', 'Schnell', 'Vegetarisch', 'Hähnchen', 'fav'];
async function loadRecipes() {
  if (!RECIPES) $('#recipes').innerHTML = `<div class="foot">${t('recipes.loading')}</div>`;

function timeText(z) {
  if (!z) return '';
  const m = /^P(?:T)?(?:(\d+)H)?(?:(\d+)M)?$/.exec(z); if (m) return mins((+m[1] || 0) * 60 + (+m[2] || 0));
  return z.replace(/Minuten/, 'min');
}
function renderRecipes() {
  if (!RECIPES) return;

  return window.ZXing ? Promise.resolve() : new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = 'zxing.min.js'; s.onload = ok; s.onerror = () => fail(new Error(t('scan.noScanner'))); document.head.appendChild(s);
  });
}
async function scanStart() {
  const secure = window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  $('#sheetIn').innerHTML = `<h3>${t('scan.heading')}</h3>
    ${secure ? `<div class="scanbox"><video id="scanVid" playsinline muted autoplay></video><div class="scanframe"></div></div><p class="muted">${t('scan.frameInfo')}</p>` :
      `<p class="muted">${CONFIG.https_url ? t('scan.secureOnly', { link: `<a href="${esc(CONFIG.https_url)}" target="_blank">${esc(CONFIG.https_url.replace(/^https:\/\//, ''))}</a>` }) : t('scan.httpsOnly')}</p><p class="muted">${t('scan.typeNumber')}</p>`}
    <div class="wline"><input id="scanCode" inputmode="numeric" placeholder="${t('scan.numberPh')}" enterkeyhint="go" onkeydown="if(event.key==='Enter')scanResult(this.value)"><button onclick="scanResult($('#scanCode').value)">${t('common.search')}</button></div>
    <div class="row2"><button class="btn ghost" onclick="closeSheet()">${t('common.cancel')}</button></div>`;
  $('#sheet').classList.add('on');
  if (!secure) return;
  try {
    // Portrait (2026-11-23, before only landscape was reliable): ask for full resolution, decode only the frame (there the
    // barcode is big), with TRY_HARDER (also tries rotated) and the whole picture on every third attempt.
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
    const v = $('#scanVid'); v.srcObject = stream; await v.play();
    SCAN = { stream, active: true, n: 0 };
    try {
      const [track] = stream.getVideoTracks(), cap = track.getCapabilities ? track.getCapabilities() : {};
      if (cap.focusMode && cap.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (e) {}
    let det = null;
    if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }); } catch (e) {} }
    if (!det) await loadZxing();
    const run = async () => {
      if (!SCAN || !SCAN.active) return;
      let code = null;
      try { code = det ? ((await det.detect(v))[0] || {}).rawValue : scanFrame(v, v.videoWidth, v.videoHeight, v, SCAN_MODES[SCAN.n++ % SCAN_MODES.length]); } catch (e) {}
      if (code && SCAN) { if (navigator.vibrate) navigator.vibrate(60); scanStop(); return scanResult(code); }
      if (SCAN) SCAN.t = setTimeout(run, 110);
    };
    run();
  } catch (e) { toast(e && e.name === 'NotAllowedError' ? t('scan.notAllowed') : t('scan.cameraFailed', { msg: e.message || e })); }
}
// Decode one picture. Modes alternate per camera picture: frame (middle, 90 % wide, 40 % high of the visible area,
// converted for object-fit: cover), frame slightly rotated (±7°, held at an angle), a vertical strip rotated by 90°
// (barcode upright on the pack) and the whole picture. Returns the code or throws (nothing found).
const SCAN_MODES = ['frame', 'frame+7', 'frame', 'frame-7', 'vertical', 'frame', 'whole'];
let ZREADER = null, ZCANVAS = null;
function scanFrame(source, vw, vh, box, mode) {
  if (!vw || !vh) return null;
  if (!ZREADER) {
    ZREADER = new ZXing.MultiFormatReader(); const h = new Map(), F = ZXing.BarcodeFormat;
    h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E]); h.set(ZXing.DecodeHintType.TRY_HARDER, true);
    ZREADER.setHints(h); ZCANVAS = document.createElement('canvas');
  }
  const W = box.clientWidth || vw, H = box.clientHeight || vh, s = Math.max(W / vw, H / vh), dw = W / s, dh = H / s, ox = (vw - dw) / 2, oy = (vh - dh) / 2;
  let sx = 0, sy = 0, sw = vw, sh = vh, angle = 0;
  if (mode === 'vertical') { sx = ox + dw * 0.25; sy = oy + dh * 0.04; sw = dw * 0.5; sh = dh * 0.92; angle = 90; }
  else if (mode !== 'whole') {
    sx = ox + dw * 0.05; sy = oy + dh * 0.30; sw = dw * 0.90; sh = dh * 0.40;
    angle = mode === 'frame+7' ? 7 : mode === 'frame-7' ? -7 : 0;
    if (angle) { sy -= sh * 0.15; sh *= 1.3; }  // a bit more height so nothing is cut off when rotated
  }
  const k = Math.min(1, 1280 / Math.max(sw, sh)), cw = Math.round(sw * k), ch = Math.round(sh * k), across = angle === 90;
  ZCANVAS.width = across ? ch : cw; ZCANVAS.height = across ? cw : ch;
  const ctx = ZCANVAS.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (angle) { ctx.translate(ZCANVAS.width / 2, ZCANVAS.height / 2); ctx.rotate(angle * Math.PI / 180); ctx.translate(-cw / 2, -ch / 2); }
  ctx.drawImage(source, sx, sy, sw, sh, 0, 0, cw, ch);
  const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(ZCANVAS)));
  return ZREADER.decodeWithState(bmp).getText();
}
function scanStop() {
  if (SCAN) { SCAN.active = false; clearTimeout(SCAN.t); try { SCAN.stream.getTracks().forEach(track => track.stop()); } catch (e) {} }
  SCAN = null;
}

let SHOP = null, SHOP_BASE = null;  // SHOP = what is shown: the last list from the server (SHOP_BASE) plus the offline queue
async function loadShop() {
  await whoReady();
  if (!SHOP_BASE) {
    const c = shopCache();
    if (c) { SHOP_BASE = c.data; SHOPQ.at = c.at; shopView(); }
    else if (!SHOP) $('#shop').innerHTML = `<div class="foot">${t('shop.loading')}</div>`;
  }
  await syncShop();  // offline changes first, so the fresh list already has them
  let r = null;
  try { const res = await fetch('api/einkauf'); if ((res.headers.get('content-type') || '').includes('json')) r = await json(res); } catch (e) {}
  const c = shopCache();
  if (!r) {  // no answer (offline, server down, error page of the proxy): the copy on this device
    SHOPQ.offline = true; SHOP_BASE = c ? c.data : (SHOP_BASE || { error: t('common.unreachable') }); if (c) SHOPQ.at = c.at;
    return shopView();
  }
  SHOPQ.offline = false;
  if (!r.error) { saveShopCache(r); SHOPQ.at = Date.now(); SHOP_BASE = r; }
  else SHOP_BASE = c ? { ...c.data, error: r.error } : r;
  shopView();
}

// ----- Offline shopping list: the last list stays on the device, ticks and new items wait in a queue -----
// localStorage ft-shop-cache {who, at, data} and ft-shop-queue {who, ops}. who = account:household (ft-who), so another
// account never sees or sends them; sign-out deletes both. ops: {k, op: 'check', id, checked} | {k, op: 'add', cid, text},
// sent in order as soon as the server answers again (adds with client_id, so a repeat after a lost answer adds nothing).
const SHOPQ = { offline: false, syncing: null, at: 0 };
const who = () => { try { return localStorage.getItem('ft-who') || ''; } catch (e) { return ''; } };
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function shopCache() { const c = lsGet('ft-shop-cache'); return c && c.who && c.who === who() && c.data ? c : null; }
function shopQueue() { const q = lsGet('ft-shop-queue'); return q && q.who === who() && Array.isArray(q.ops) ? q.ops : []; }
function setQueue(ops) { lsSet('ft-shop-queue', ops.length ? { who: who(), ops } : null); }
function saveShopCache(data) { if (who()) lsSet('ft-shop-cache', { who: who(), at: Date.now(), data }); }
function clearShopLocal() { lsSet('ft-shop-cache', null); lsSet('ft-shop-queue', null); SHOP = SHOP_BASE = null; }
const newCid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12)).replace(/[^\w-]/g, '');
function enqueue(op) {  // a newer tick of the same item replaces the older one (the server takes the state, not a toggle)
  let ops = shopQueue();

      let res, r;

          body: JSON.stringify(o.op === 'add' ? { text: o.text, client_id: o.cid } : { id: o.id, checked: o.checked }) });
        if (!(res.headers.get('content-type') || '').includes('json')) throw new Error('no answer');  // e.g. the proxy's error page
        r = await res.json();

// Live: a job that ends or new cards redraw the start page (status comes from refreshStatus, no extra request)
setInterval(() => {
  if (!HOME || document.hidden || !$('#v-home').classList.contains('on') || homeKey() === HOME.key) return;
  const now = homeJobs().map(j => j[0]);
  if (HOME.jobs.some(j => !now.includes(j))) loadHome(); else renderHome();
}, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#v-home').classList.contains('on')) loadHome(); });
// Opening the app: Start, unless the app was left a moment ago (iOS reloads the home screen app, e.g. while shopping)
function startView() {
  try {
    const tab = VIEW_OLD[localStorage.getItem('ft-tab')] || localStorage.getItem('ft-tab');
    if (tab && document.getElementById('v-' + tab) && Date.now() - (+localStorage.getItem('ft-left') || 0) < 30 * 60e3) return tab;
  } catch (e) {}
  return 'home';
}
const leftNow = () => { try { localStorage.setItem('ft-left', String(Date.now())); } catch (e) {} };
document.addEventListener('visibilitychange', () => { if (document.hidden) leftNow(); });
window.addEventListener('pagehide', leftNow);

// ----- Keyboard: Escape closes, on the desktop Enter in a dialog presses its main button, Tab stays in the dialog,
// cards and rows open with Enter, arrows swipe (Discover) and turn the steps (cooking and meal prep mode) -----
const DESK = matchMedia('(hover: hover) and (pointer: fine)');
$('#sheetIn').tabIndex = -1;
document.addEventListener('keydown', e => {
  const tg = e.target, typing = !!(tg.matches && tg.matches('input, textarea, select, [contenteditable]'));
  const sheetOn = $('#sheet').classList.contains('on'), cook = $('#cook'), cookOn = cook.classList.contains('on'), recOn = $('#recipe').classList.contains('on');
  if (e.key === 'Escape') {
    if (sheetOn) closeSheet();
    else if (cookOn) cook.classList.contains('prep') ? prepEnd() : cookEnd();
    else if (recOn && !$('#recipe .edit')) REC ? history.back() : closeRecipe();  // the edit form only closes with its buttons
    else if (SET.on && SET.page && !typing) settingsSheet();
    else if ($('#why').classList.contains('on')) hideWhy();
    else return;
    e.preventDefault(); return;
  }
  if (!DESK.matches || e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
  if (e.key === 'Tab' && sheetOn) {  // focus stays inside the dialog
    const f = [...$('#sheetIn').querySelectorAll('button, a[href], input, select, textarea, [tabindex="0"]')].filter(x => !x.disabled && x.offsetParent);
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && (i < 0 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
    return;
  }
  if (e.key === 'Enter' && (sheetOn || SET.page && tg.closest('#sheetIn')) && tg.tagName === 'INPUT' && !tg.hasAttribute('onkeydown') && !['checkbox', 'radio', 'file', 'button'].includes(tg.type)) {
    const b = [...$('#sheetIn').querySelectorAll('.btn:not(.ghost)')].find(x => !x.disabled && x.offsetParent);
    if (b) { e.preventDefault(); b.click(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && !typing && tg.getAttribute && tg.getAttribute('tabindex') === '0' && tg.hasAttribute('onclick')) { e.preventDefault(); tg.click(); return; }
  if (typing || sheetOn) return;
  const dir = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (cookOn) { if (dir) { e.preventDefault(); cook.classList.contains('prep') ? (PREP && !(dir > 0 && PREP.i === PREP.a.schritte.length - 1) && prepGo(dir)) : cookGo(dir); } return; }
  if (!recOn && $('#v-deck').classList.contains('on')) {
    const act = { ArrowLeft: 'nope', ArrowRight: 'like', ArrowUp: 'plan' }[e.key];
    if (act) { e.preventDefault(); swipeTop(act); }
  }
});
// Clickable cards and rows (div with onclick) can be reached with Tab on the desktop
let tabT = 0;
const tabbable = () => { tabT = 0; document.querySelectorAll('[onclick]:not(button):not(a):not(input):not(label):not(.sheet):not([tabindex])').forEach(el => { el.tabIndex = 0; }); };
if (DESK.matches) { new MutationObserver(() => { if (!tabT) tabT = requestAnimationFrame(tabbable); }).observe(document.body, { childList: true, subtree: true }); tabbable(); }
// Opening a dialog moves the focus into it, closing it brings the focus back
let SHEET_FOCUS = null;
new MutationObserver(() => {
  if (!DESK.matches) return;
  const on = $('#sheet').classList.contains('on');
  if (on && !SHEET_FOCUS) { SHEET_FOCUS = document.activeElement || document.body; $('#sheetIn').focus({ preventScroll: true }); }
  if (!on && SHEET_FOCUS) { const f = SHEET_FOCUS; SHEET_FOCUS = null; if (f.focus && document.contains(f)) f.focus({ preventScroll: true }); }
}).observe($('#sheet'), { attributes: true, attributeFilter: ['class'] });

markMeal();
loadStack().then(refreshStatus);
setInterval(refreshStatus, 20000);
const START = viewFromLink() || startView();
if (START !== 'home') { loadShop(); loadFreezer(true); }
show(START); handleLink();
try { if (sessionStorage.getItem('ft-settings')) { sessionStorage.removeItem('ft-settings'); openSettings(); } } catch (e) {}  // language switched in the settings  // the view first, then direct links (show() closes an open recipe)
// Offline and Web Push: service worker (app shell cache, push), who is signed in, waiting offline changes
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e));
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'open' && e.data.view && document.getElementById('v-' + e.data.view)) show(e.data.view); });
}
whoReady().then(() => {
  if (SHOPQ.offline && START === 'home' && (shopCache() || shopQueue().length)) { show('shop'); toast(t('shop.offlineStart')); }
  else if (shopQueue().length) syncShop().then(r => { if (r || shopOn()) loadShop(); });
  pushReconcile();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshStatus(); loadMoreSoon(); } });
</script>
</body>
</html>
